<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tetris T. Boiadeiro Querêncio da Mata</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        body {
            background-color: #080d1a;
            color: #f3f4f6;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            touch-action: manipulation;
        }
        .header-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            text-align: center;
            background: #111827;
            padding: 8px 12px;
            border-radius: 10px;
            border: 2px solid #d4af37;
            width: 100%;
            max-width: 360px;
        }
        .header-logo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #d4af37;
            object-fit: cover;
        }
        h1 { color: #d4af37; margin: 0; font-size: 0.85rem; text-transform: uppercase; }
        p.subtitle { color: #10b981; font-size: 0.65rem; margin: 2px 0 0 0; font-weight: bold; }

        .game-panel {
            background: #111827;
            border: 2px solid #d4af37;
            border-radius: 12px;
            padding: 12px;
            max-width: 360px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.7);
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 10px;
            font-size: 0.85rem;
            font-weight: bold;
            color: #d4af37;
            background: #1f2937;
            padding: 6px 10px;
            border-radius: 6px;
        }

        canvas {
            border: 2px solid #374151;
            background: #050811;
            border-radius: 4px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        /* Controles de Toque para Celular */
        .controls-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 100%;
            margin-top: 12px;
        }
        .ctrl-btn {
            background: #1f2937;
            border: 1px solid #d4af37;
            color: #d4af37;
            padding: 14px 0;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: background 0.1s;
        }
        .ctrl-btn:active {
            background: #d4af37;
            color: #080d1a;
        }
        .btn-start {
            background: #10b981;
            color: #0b131f;
            border: none;
            padding: 12px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            width: 100%;
            margin-top: 10px;
            text-transform: uppercase;
        }

        /* Grade de Seleção de Entidades com Fotos */
        .entity-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            width: 100%;
            margin: 8px 0;
            max-height: 220px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .entity-option {
            background: #1f2937;
            border: 2px solid #374151;
            border-radius: 8px;
            padding: 6px;
            text-align: center;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.5s;
        }
        .entity-option img {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #d4af37;
            flex-shrink: 0;
        }
        .entity-option span {
            font-size: 0.75rem;
            font-weight: bold;
            color: #f3f4f6;
            text-align: left;
            line-height: 1.1;
        }
        .entity-option:hover, .entity-option.selected {
            border-color: #d4af37;
            background: #2b374a;
        }

        /* Tela Sobreposta */
        .overlay-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(8, 13, 26, 0.96);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            text-align: center;
            padding: 16px;
            border-radius: 12px;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="header-container">
        <img src="https://i.ibb.co/60wpJ3xG/Logo-terreiro.jpg" class="header-logo" alt="Logo">
        <div>
            <h1>Tetris T. Boiadeiro Querêncio da Mata</h1>
                    </div>
    </div>

    <div class="game-panel" style="position: relative;">
        
        <!-- TELA DE SELEÇÃO DE ENTIDADE -->
        <div id="startScreen" class="overlay-screen">
            <h2 style="color: #d4af37; margin-top: 0; font-size: 1rem;">Escolha sua Linha e comece a jogar</h2>
                        
            <div class="entity-grid" id="entityGrid">
                <!-- Inserido dinamicamente pelo JavaScript -->
            </div>

            <button class="btn-start" onclick="initGame()">Iniciar</button>
        </div>

        <!-- TELA DE GAME OVER -->
        <div id="gameOverScreen" class="overlay-screen hidden">
            <h2 style="color: #ef4444; margin-top: 0;">Game over</h2>
            <p id="finalScoreText" style="font-size: 0.9rem; margin-bottom: 15px;"></p>
            <button class="btn-start" onclick="resetToMenu()">Escolher outra Linha</button>
        </div>

        <div class="stats-bar">
            <span>Guia: <strong id="currentEntityName" style="color:#10b981;">Boiadeira</strong></span>
            <span>Pts: <strong id="score" style="color:#fff;">0</strong></span>
        </div>

        <!-- O Tabuleiro do Tetris -->
        <canvas id="tetris" width="200" height="400"></canvas>

        <!-- BOTÕES DE CONTROLE NA TELA -->
        <div class="controls-container">
            <button class="ctrl-btn" onclick="move(-1)">◀</button>
            <button class="ctrl-btn" onclick="rotate()">🔄</button>
            <button class="ctrl-btn" onclick="move(1)">▶</button>
            <button class="ctrl-btn" onclick="moveDrop()" style="grid-column: span 3; padding: 10px;">⬇ Descer Rápido</button>
        </div>
    </div>

    <script>
        // Suas 23 fotos oficiais do ImgBB
        const entitiesList = [
            { name: "Boiadeira", img: "https://i.ibb.co/HfY97m1Q/boiadeira.jpg" },
            { name: "Boiadeiro", img: "https://i.ibb.co/5gLgyczK/boiadeiro.jpg" },
            { name: "Oriente", img: "https://i.ibb.co/FLgvpKB3/oriente.jpg" },
            { name: "Preta Velha", img: "https://i.ibb.co/sd9BPvWv/preta-velha.jpg" },
            { name: "Preto Velho", img: "https://i.ibb.co/k6GfJWrY/preto-velho.jpg" },
            { name: "Piratas", img: "https://i.ibb.co/fzqdSF1G/pirata.png" },
            { name: "Marinheiros", img: "https://i.ibb.co/Xxz6w90k/marinheiro.png" },
            { name: "Malandra", img: "https://i.ibb.co/nMd6MMHZ/malandra.jpg" },
            { name: "Exu Mirim", img: "https://i.ibb.co/zTRw2nx4/exu-mirim.jpg" },
            { name: "Pombo Gira", img: "https://i.ibb.co/LXzgCM58/pombo-gira.jpg" },
            { name: "Exu", img: "https://i.ibb.co/JfqpCFL/exu.jpg" },
            { name: "Erê Menino", img: "https://i.ibb.co/JjMSgpVS/menino.jpg" },
            { name: "Erê Menina", img: "https://i.ibb.co/1DK8P50/menina.jpg" },
            { name: "Cigano", img: "https://i.ibb.co/6RdGXtz2/cigano.png" },
            { name: "Cigana", img: "https://i.ibb.co/Sw3KpbGY/cigana.jpg" },
            { name: "Curumim", img: "https://i.ibb.co/XfLKzfQd/curumim.jpg" },
            { name: "Cabocla", img: "https://i.ibb.co/qYtp3mh7/cabloca.jpg" },
            { name: "Caboclo", img: "https://i.ibb.co/6RdKhHD0/caboclo.jpg" },
            { name: "Cangaceira", img: "https://i.ibb.co/dsW4Tqq6/cangaceira.jpg" },
            { name: "Cangaceiro", img: "https://i.ibb.co/zHPmRYV5/cangaceiro.jpg" },
            { name: "Baianos", img: "https://i.ibb.co/FbKVVDNH/baianos.jpg" },
            { name: "Baianas", img: "https://i.ibb.co/whgzzmyQ/baianas.jpg" },
            { name: "Zé Pilintra", img: "https://i.ibb.co/chHZZYW1/ze-pilintra.jpg" }
        ];

        let selectedEntityIndex = 0; // Padrão Boiadeira

        function renderEntityGrid() {
            const grid = document.getElementById('entityGrid');
            grid.innerHTML = '';
            entitiesList.forEach((ent, index) => {
                const div = document.createElement('div');
                div.className = `entity-option ${index === selectedEntityIndex ? 'selected' : ''}`;
                div.innerHTML = `<img src="${ent.img}" alt="${ent.name}"><span>${ent.name}</span>`;
                div.onclick = () => {
                    document.querySelectorAll('.entity-option').forEach(el => el.classList.remove('selected'));
                    div.classList.add('selected');
                    selectedEntityIndex = index;
                };
                grid.appendChild(div);
            });
        }

        window.onload = renderEntityGrid;

        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        context.scale(20, 20);

        const arena = createMatrix(10, 20);

        const player = {
            pos: {x: 0, y: 0},
            matrix: null,
            score: 0,
            level: 1,
        };

        let dropCounter = 0;
        let dropInterval = 400; 
        let lastTime = 0;
        let gameActive = false;

        const colors = [
            null,
            '#d4af37', // 1: Ouro
            '#10b981', // 2: Verde
            '#ef4444', // 3: Vermelho
            '#3b82f6', // 4: Azul
            '#a855f7', // 5: Roxo
            '#f59e0b', // 6: Laranja
            '#ec4899'  // 7: Rosa
        ];

        const symbols = ['', '➰', '🌿', '🔱', '🌊', '⚔️', '🥥', '🍬'];

        function createMatrix(w, h) {
            const matrix = [];
            while (h--) {
                matrix.push(new Array(w).fill(0));
            }
            return matrix;
        }

        function createPiece(type) {
            if (type === 'T') return [[0, 1, 0], [1, 1, 1], [0, 0, 0]];
            else if (type === 'O') return [[2, 2], [2, 2]];
            else if (type === 'L') return [[0, 0, 3], [3, 3, 3], [0, 0, 0]];
            else if (type === 'J') return [[4, 0, 0], [4, 4, 4], [0, 0, 0]];
            else if (type === 'I') return [[0, 5, 0, 0], [0, 5, 0, 0], [0, 5, 0, 0], [0, 5, 0, 0]];
            else if (type === 'S') return [[0, 6, 6], [6, 6, 0], [0, 0, 0]];
            else if (type === 'Z') return [[7, 7, 0], [0, 7, 7], [0, 0, 0]];
        }

        function drawMatrix(matrix, offset) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        context.fillStyle = colors[value];
                        context.fillRect(x + offset.x, y + offset.y, 1, 1);
                        
                        context.strokeStyle = '#080d1a';
                        context.lineWidth = 0.05;
                        context.strokeRect(x + offset.x, y + offset.y, 1, 1);

                        context.fillStyle = '#ffffff';
                        context.font = '0.6px Segoe UI Emoji, Apple Color Emoji, sans-serif';
                        context.textAlign = 'center';
                        context.textBaseline = 'middle';
                        context.fillText(symbols[value], x + offset.x + 0.5, y + offset.y + 0.55);
                    }
                });
            });
        }

        function draw() {
            context.fillStyle = '#050811';
            context.fillRect(0, 0, canvas.width, canvas.height);
            drawMatrix(arena, {x: 0, y: 0});
            drawMatrix(player.matrix, player.pos);
        }

        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        arena[y + player.pos.y][x + player.pos.x] = value;
                    }
                });
            });
        }

        function arenaSweep() {
            let rowCount = 1;
            outer: for (let y = arena.length - 1; y > 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) continue outer;
                }
                const row = arena.splice(y, 1)[0].fill(0);
                arena.unshift(row);
                ++y;

                player.score += rowCount * 100;
                rowCount *= 2;
                
                player.level = Math.floor(player.score / 400) + 1;
                dropInterval = Math.max(100, 400 - (player.level - 1) * 35);
            }
            updateScore();
        }

        function collide(arena, player) {
            const m = player.matrix;
            const o = player.pos;
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) return true;
                }
            }
            return false;
        }

        function playerDrop() {
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
            }
            dropCounter = 0;
        }

        function moveDrop() {
            if (!gameActive) return;
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
            }
            dropCounter = 0;
        }

        function move(dir) {
            if (!gameActive) return;
            player.pos.x += dir;
            if (collide(arena, player)) player.pos.x -= dir;
        }

        function playerReset() {
            const pieces = 'TJLOSZI';
            player.matrix = createPiece(pieces[Math.floor(pieces.length * Math.random())]);
            player.pos.y = 0;
            player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
            
            if (collide(arena, player)) {
                gameActive = false;
                document.getElementById('finalScoreText').innerHTML = `Com a linha de <strong>${entitiesList[selectedEntityIndex].name}</strong>, você fez <strong>${player.score}</strong> pontos!`;
                document.getElementById('gameOverScreen').classList.remove('hidden');
            }
        }

        function rotateMatrix(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
                }
            }
            if (dir > 0) matrix.forEach(row => row.reverse());
            else matrix.reverse();
        }

        function rotate() {
            if (!gameActive) return;
            const posX = player.pos.x;
            let offset = 1;
            rotateMatrix(player.matrix, 1);
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotateMatrix(player.matrix, -1);
                    player.pos.x = posX;
                    return;
                }
            }
        }

        function update(time = 0) {
            if (!gameActive) return;
            const deltaTime = time - lastTime;
            lastTime = time;
            dropCounter += deltaTime;
            if (dropCounter > dropInterval) playerDrop();
            draw();
            requestAnimationFrame(update);
        }

        function updateScore() {
            document.getElementById('score').innerText = player.score;
        }

        function initGame() {
            arena.forEach(row => row.fill(0));
            player.score = 0;
            player.level = 1;
            dropInterval = 400;
            document.getElementById('currentEntityName').innerText = entitiesList[selectedEntityIndex].name;
            updateScore();
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            gameActive = true;
            playerReset();
            lastTime = performance.now();
            update();
        }

        function resetToMenu() {
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('startScreen').classList.remove('hidden');
            renderEntityGrid();
        }
    </script>
</body>
</html>
